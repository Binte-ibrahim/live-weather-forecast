<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather Forecast</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="weather-container">

        <h1>Live Weather Forecast</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>


        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <p id="errorMessage"></p>


        <p id="loadingMessage">
            🔄 Getting weather data...
        </p>


        <div
            class="weather-card"
            id="weatherCard"
        >
        
        <div
        class="weather-icon"
        id="weatherIcon"
        >
        🌤️
    </div>
    
    <h2 id="cityName">
        Karachi
    </h2>
    
    
    <div class="temperature">
        
        <span id="temperature">
            32
        </span>
        
        <span>°C</span>
        
    </div>
    
    
    <p id="condition">
        Clear Sky
    </p>
    
    
    <div class="weather-details">
        
        
        <div class="detail">
            
            <span class="detail-icon">
                💧
            </span>
            
            <div>
                
                <p>Humidity</p>
                
                <span id="humidity">
                    60%
                </span>
                
            </div>
            
        </div>
        
        
        <div class="detail">
            
            <span class="detail-icon">
                🌬️
            </span>
            
            <div>
                
                <p>Wind Speed</p>
                
                <span id="windSpeed">
                    13 km/h
                </span>
                
            </div>
            
        </div>
        
        
    </div>
    <section class="forecast-section">
    
    <h2>3-Day Forecast</h2>
    
    <div
        id="forecastContainer"
        class="forecast-container"
    ></div>
    
    </section>
    
</div>

</div>


<script src="script.js"></script>

</body>

</html>
